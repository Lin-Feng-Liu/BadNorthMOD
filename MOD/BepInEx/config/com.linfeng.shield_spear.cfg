## Settings file was created by plugin Shield Spear v1.1.2
## Plugin GUID: com.linfeng.shield_spear

[Bonus]

## 不带盾士兵 maxSpeed 乘数（1.1 = 移速 +10%）。一级队、未装盾的二级以上队伍、碎盾后的士兵都吃这条
# Setting type: Single
# Default value: 1.1
MoveSpeedBonus = 1.1

## 不带盾士兵出矛频率乘数（1.2 = 出矛次数 +20%，实现为出矛间隔 × 1/1.2 ≈ 0.8333）
# Setting type: Single
# Default value: 1.2
AttackSpeedBonus = 1.2

[Debug]

## 详细日志：注入/跳过、开关翻转、装盾、指挥官减速、满血跳过等（默认关）。换盾、卸盾、错误始终打印
# Setting type: Boolean
# Default value: false
VerboseLog = false

[Penalty]

## 带盾士兵 maxSpeed 乘数（0.8 = 移速 -20%）
# Setting type: Single
# Default value: 0.8
SpeedMultiplier = 0.8

## 带盾士兵出矛间隔乘数（1.18 ≈ 出矛次数 -15%）
# Setting type: Single
# Default value: 1.18
StabIntervalMultiplier = 1.18

[Replenish]

## 盾矛队进房屋时，满血士兵不等治疗时间（受伤的照常等，缺员补人照常）。关掉则走原版全员逐个等待
# Setting type: Boolean
# Default value: true
SkipHealWaitForHealthy = true

## 满血士兵每人的象征性等待秒数（保留一点节奏感）
# Setting type: Single
# Default value: 0.15
