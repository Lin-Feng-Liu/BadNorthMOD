[Skill]

## 开关技能冷却秒数（只防连点，盾牌真正的节奏由补充决定）
# Setting type: Single
# Default value: 5
ToggleCooldown = 5

## 长矛队至少几级才显示技能（原版 SpearShield 一级不生效，不要低于 2）
# Setting type: Int32
# Default value: 2
MinSquadLevel = 2

