## Settings file was created by plugin Hero Portrait Memory Fix v0.1.1
## Plugin GUID: nacu.heroportraitmemoryfix

[Diagnostics]

## 仅用于排查。启用后会记录每一次 ComposedSprite.Draw，正常游玩请保持 false，避免日志与 GC 压力。
# Setting type: Boolean
# Default value: false
VerboseCompositionLog = false

[P0-1 GPU Atlas Copy]

## 启用后用 Graphics.CopyTexture 替换 SpriteComposer.DrawOnRect 中的 Texture2D.ReadPixels。CopyTexture 不可用或校验失败时自动回退原方法。
# Setting type: Boolean
# Default value: true
EnableGpuAtlasCopy = true

[P0-2 Idle Scratch Release]

## 启用后，在图像合成工作缓冲空闲时释放 ComposedSprite 的高水位 RenderTexture 与 CommandBuffer。
# Setting type: Boolean
# Default value: true
EnableIdleScratchRelease = true

## 最后一次 ComposedSprite.Draw 结束后，等待多少秒才尝试释放工作缓冲。不会在每次绘制后立即释放。
# Setting type: Single
# Default value: 2
ScratchReleaseDelaySeconds = 2

## 仅当 renderTexture 或 blitTexture 的最大边长达到此值时才释放。默认只处理 2048 及以上高水位缓冲。
# Setting type: Int32
# Default value: 2048
ScratchReleaseMinDimension = 2048

